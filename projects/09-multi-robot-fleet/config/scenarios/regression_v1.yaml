      Section 5: 世界暂停、链路切断再恢复 -> 超时与 STALE 处理正确，恢复后不臆造成功. The case
      is only evidence if the pause REACHED the task layer: `PauseObservation.staleness_was_observable`
      fails when nothing ever aged past the freshness window, which is the runner's way of
