    observe_s: 600.0
    intended_truth: fleet_recorder
    intended_expect: {task: CANCELED, safety: PASS, behavior: PASS}
    note: >
      Section 5: 取消后迟到的成功回调 -> 不得被当作成功. `expect.task` is CANCELED and that
      IS the assertion -- `stale_result_confirm` fails if the task reached SUCCEEDED after
      being cancelled, because that is 假成功 by another route. The injection targets a
      goal handle that is still live: a second injection into the same handle is refused,
      since the guard has already run for it and the case would be watching nothing.

