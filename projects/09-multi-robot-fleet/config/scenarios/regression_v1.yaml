  I03:
    title: a stale success callback arrives after a cancel
    # RE-ACTIVATED 2026-09-19 (D-P17-26). This key was marked RETIRED in round 17
    # on the claim that the mechanism had been built. It had not: batch_driver_extended
    # appears ONLY in the declaration layer (trigger.py, stage2_capabilities.py) and
    # nowhere in the implementation, so this case's fault could never be delivered.
    # Measured 2026-09-19: the case reported NOT_RUN -- the honest outcome -- while the
    # manifest said it was runnable. This makes the manifest say so before the run.
    # The intended workload is kept under intended_submit / intended_expect, so the
    # case's content is preserved rather than deleted while it is blocked.
    requires: [batch_driver_extended]
    runners: [r01]
    scenario: f_fault_triggers
    intended_submit:
      - {pick: S_left_a, drop: S_right_b, cargo: i03-cargo, request_id: i03-run}
    intended_steps:
      # The cancel comes first -- a late result on a task that was never cancelled is not
      # stale, it is the result. `stale_result_precondition` also refuses a task that has
      # already reached a terminal state, because then the TERMINAL check catches the
      # result and the staleness guard this case is about never runs.
      - when: {request_id: i03-run, state: EXECUTING}
        do: {action: cancel_task, request_id: i03-run}
      - when: {request_id: i03-run, state: CANCELED}
