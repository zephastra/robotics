schema_version: 1
ros:
  domain_id: 43
  rmw: rmw_cyclonedds_cpp
  use_sim_time: true
  topics:
    clock: /clock
    scan: /scan
    odom: /odom
    tf: /tf
    tf_static: /tf_static
